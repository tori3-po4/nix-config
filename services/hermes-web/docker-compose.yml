name: hermes-web

x-firecrawl-common-service: &firecrawl-common-service
  image: ghcr.io/firecrawl/firecrawl:latest
  restart: unless-stopped
  networks:
    - hermes-web
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
      compress: "true"

x-firecrawl-env: &firecrawl-env
  REDIS_URL: redis://firecrawl-redis:6379
  REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
  PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: firecrawl-postgres
  POSTGRES_PORT: 5432
  USE_DB_AUTHENTICATION: "false"
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-4}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-6}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-3}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY:-local-only-change-me}
  LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
  SEARXNG_ENDPOINT: http://searxng:8080
  SEARXNG_ENGINES: ${SEARXNG_ENGINES:-}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES:-}

services:
  searxng-valkey:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    networks:
      - hermes-web
    volumes:
      - searxng-valkey:/data
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    depends_on:
      - searxng-valkey
    networks:
      - hermes-web
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    restart: unless-stopped
    networks:
      - hermes-web
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-6}
      PROXY_SERVER: ${PROXY_SERVER:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS:-false}
      BLOCK_MEDIA: ${BLOCK_MEDIA:-}
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"

  firecrawl-api:
    <<: *firecrawl-common-service
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_started
    ports:
      - "127.0.0.1:${FIRECRAWL_PORT:-3002}:3002"
    environment:
      <<: *firecrawl-env
      HOST: 0.0.0.0
      PORT: 3002
      EXTRACT_WORKER_PORT: 3004
      WORKER_PORT: 3005
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}
      ENV: local
    command: node dist/src/harness.js --start-docker
    mem_limit: 6g

  firecrawl-redis:
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    command: redis-server --bind 0.0.0.0
    networks:
      - hermes-web
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        compress: "true"

  firecrawl-rabbitmq:
    image: docker.io/library/rabbitmq:3-management
    restart: unless-stopped
    command: rabbitmq-server
    networks:
      - hermes-web
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
        compress: "true"

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    restart: unless-stopped
    networks:
      - hermes-web
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - firecrawl-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"

networks:
  hermes-web:
    driver: bridge

volumes:
  searxng-valkey:
  searxng-cache:
  firecrawl-postgres:
