name: hermes-web

services:
  searxng-valkey:
    image: docker.io/valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 30 1 --loglevel warning
    networks:
      - hermes-web
    volumes:
      - searxng-valkey:/data
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    depends_on:
      - searxng-valkey
    networks:
      - hermes-web
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"

  crawl4ai:
    image: ${CRAWL4AI_IMAGE:-unclecode/crawl4ai:latest}
    restart: unless-stopped
    networks:
      - hermes-web
    ports:
      - "127.0.0.1:${CRAWL4AI_PORT:-11235}:11235"
    shm_size: ${CRAWL4AI_SHM_SIZE:-1g}
    mem_limit: ${CRAWL4AI_MEMORY_LIMIT:-3g}
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
      CRAWL4AI_HOOKS_ENABLED: ${CRAWL4AI_HOOKS_ENABLED:-false}
      CRAWL4AI_LOG_LEVEL: ${CRAWL4AI_LOG_LEVEL:-INFO}
      REDIS_TASK_TTL: ${CRAWL4AI_REDIS_TASK_TTL:-3600}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        compress: "true"

networks:
  hermes-web:
    driver: bridge

volumes:
  searxng-valkey:
  searxng-cache:
