use_default_settings: true

general:
  instance_name: "Hermes SearXNG"

search:
  default_lang: ""
  autocomplete: duckduckgo
  formats:
    - html
    - json
  safe_search: 0
  suspended_times:
    SearxEngineAccessDenied: 3600
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 900
    cf_SearxEngineCaptcha: 86400
    cf_SearxEngineAccessDenied: 3600
    recaptcha_SearxEngineCaptcha: 86400

outgoing:
  request_timeout: 4.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  # General web search: keep a small set of reliable engines and weight them
  # above encyclopedic/specialized sources.
  - name: brave
    disabled: false
    weight: 2.0
    timeout: 5.0
  - name: google cse
    disabled: false
    weight: 1.8
    timeout: 5.0
  - name: bing
    disabled: false
    weight: 1.5
    timeout: 5.0
  - name: duckduckgo
    disabled: false
    weight: 1.2
    timeout: 5.0
  - name: qwant
    disabled: false
    weight: 0.8
    timeout: 5.0
  # Mojeek is useful coverage when it works, but this local setup gets
  # access denied responses.
  - name: mojeek
    disabled: true
    weight: 0.6
    timeout: 5.0
  - name: wikipedia
    weight: 0.4
  - name: wikidata
    weight: 0.2
  # Startpage frequently fails parsing in this local setup and pollutes
  # unresponsive_engines, so keep it opt-in.
  - name: startpage
    disabled: true
  - name: startpage news
    disabled: true
  - name: startpage images
    disabled: true

server:
  secret_key: "change-this-local-hermes-searxng-secret"
  limiter: false
  image_proxy: true
  bind_address: "0.0.0.0"
  port: 8080

valkey:
  url: redis://searxng-valkey:6379/0
