# Ghostty から移行。TERM は Alacritty が起動するプロセスにのみ設定し、
# SSH 先に専用の terminfo を追加せず使えるようにする。
[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 130, lines = 28 }
opacity = 1.0
option_as_alt = "Both"

[font]
normal = { family = "HackGen Console NF", style = "Regular" }
size = 16.0
# adjust-cell-height = 20% の近似。Alacritty は物理ピクセル指定なので、
# Retina (2x) の 16pt を基準とする。DPI・文字サイズ変更時は要調整。
offset = { x = 0, y = 8 }

# 配色は home/dotfiles.nix の programs.alacritty.theme で指定する。
